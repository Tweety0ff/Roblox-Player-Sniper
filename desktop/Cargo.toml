[package]
name = "roblox-player-sniper-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop (Rust + egui) version of the Roblox Server Sniper extension"
license = "MIT"

[dependencies]
eframe = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
